name: encore
description: "A free, self-hosted music app: your own music server plus a Spotify-class Android player."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'
# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts
version: 0.1.0+111
environment:
  sdk: '>=3.0.0 <4.0.0'
# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
dependencies:
  flutter:
    sdk: flutter

  # --- state, routing, data -------------------------------------------------
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  dio: ^5.4.0
  meta: ^1.19.0
  crypto: ^3.0.3
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.0.0

  # --- Devices and Sessions: the rules and state, pure Dart, shared with the server hub ---
  encore_session:
    path: ../packages/encore_session

  # --- playback and downloads ------------------------------------------------
  just_audio: ^0.9.46
  audio_session: ^0.1.25
  audio_service: ^0.18.18
  # The type of the streams audio_service hands out (browse-tree change notices).
  rxdart: ^0.28.0
  background_downloader: ^9.6.4
  wakelock_plus: ^1.4.0

  # --- artwork and icons -----------------------------------------------------
  # Flutter's own widgets reference a few Cupertino glyphs; the font is
  # tree-shaken to under 1 KB.
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  http: ^1.2.0
  palette_generator: ^0.3.3+4
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

# For information on the generic Dart part of this file, see the
# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
  # No bundled images: the app's artwork is generated (covers, mosaics) or
  # comes from the server.
  #   - images/a_dot_burr.jpeg
