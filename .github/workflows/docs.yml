name: Hygiene

on:
  push:
    branches: [main]
  pull_request:

# The secret scanner lists a pull request's commits to scan only those.
permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  forbidden-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No logins, keys, cookies, environment files or binaries
        run: |
          bad=$(git ls-files | grep -Ei '(login[^/]*\.txt$|(^|/)credentials?[^/]*\.(txt|md|json)$|cookies[^/]*\.txt$|(^|/)\.env$|\.(apk|aab|keystore|jks|pem)$)' | grep -vi '\.example$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files are tracked:"; echo "$bad"; exit 1; fi

  state-table-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # docs/11 ADR-R41 T2: a row of docs/31 to 34 marked Built has a test (named by its id, or listed and existing). The number may only go down.
      - name: Rows marked Built that no test covers (baseline 66 on main 129ff76, 2026-10-24; lower it whenever a row gets its test)
        run: python -I tools/check_rows.py --max-missing 66
