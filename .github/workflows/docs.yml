name: Hygiene

on:
  push:
    branches: [main]
  pull_request:

# The secret scanner lists a pull request's commits to scan only those.
permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    # Two checks that take seconds each, in one job: a job is billed for at least a whole minute (D-44).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No logins, keys, cookies, environment files or binaries
        run: |
          bad=$(git ls-files | grep -Ei '(login[^/]*\.txt$|(^|/)credentials?[^/]*\.(txt|md|json)$|cookies[^/]*\.txt$|(^|/)\.env$|\.(apk|aab|keystore|jks|pem)$)' | grep -vi '\.example$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files are tracked:"; echo "$bad"; exit 1; fi
      # docs/11 ADR-R41 T2: a row of docs/31 to 34 marked Built has a test (named by its id, or listed and existing). The number may only go down.
      - name: Rows marked Built that no test covers (none on 2026-11-01; a new Built row brings its test)
        run: python -I tools/check_rows.py --max-missing 0
      # docs/08: a task id is a topic, time is the milestone; a task may not need what comes after it, and the generated timeline must be current.
      - name: The order of the plan (no task needs something that comes after it)
        run: |
          python -I tools/check_order.py --selftest
          python -I tools/check_order.py
          python -I -m unittest discover -s tools -p "test_roadmap*.py"
