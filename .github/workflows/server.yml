name: Server

# Runner: `ubuntu-26.04` on purpose, not `ubuntu-latest`. GitHub moves that label from 24.04 to 26.04 during November 2026; naming the image makes a
# change of image a pull request that is tested, not a surprise on some run. When GitHub announces the end of the 26.04 image, move it here on
# purpose (all workflows, one pull request; reminder: `docs/roadmap/notes/P0-11`).

on:
  push:
    branches: [main]
    paths: ['server/**', 'packages/**', 'tools/gen_admin_tokens.py', 'app/lib/design/tokens.dart', 'app/test/fixtures/deezer/**', 'app/test/fixtures/server/**', 'app/test/fixtures/text/**', 'app/lib/domain/text_fold_table.g.dart', 'tools/gen_text_fold_table.py', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'packages/**', 'tools/gen_admin_tokens.py', 'app/lib/design/tokens.dart', 'app/test/fixtures/deezer/**', 'app/test/fixtures/server/**', 'app/test/fixtures/text/**', 'app/lib/domain/text_fold_table.g.dart', 'tools/gen_text_fold_table.py', '.github/workflows/server.yml']
# `app/test/fixtures/deezer/` (the 20 recorded searches), `app/test/fixtures/server/` (answers the server's own tests write and compare) and
# `app/test/fixtures/text/` (the text fold's rows and digests, P2-25) are read by BOTH suites: a change to them must run this workflow as well as the
# app's (docs/30 section I). The phone's fold table `app/lib/domain/text_fold_table.g.dart` and its generator are listed for the same reason.

# The older services (fetch, people, admin, quality, recs) and the Jam hub are tested by server-legacy.yml, only when their own folder changes (D-44).

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encore-server:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        working-directory: server/encore_server
        run: pip install -e '.[youtube,dev]'
      - name: The phone's text fold table is what this Python (Unicode 15.0.0) writes
        # Python 3.12 is the interpreter the tool needs: it refuses any other Unicode version (docs/tasks P2-songs-as-references.md, P2-25 part 10).
        run: python -X utf8 tools/gen_text_fold_table.py --check
      - name: Lint, types, tests
        working-directory: server/encore_server
        run: |
          ruff check .
          ruff format --check .
          mypy encore_server
          pytest

  install-scripts:
    # The installer and the encore command run on other people's computers: they must at least be free of the mistakes a checker finds.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck server/encore_server/deploy/install.sh server/encore_server/deploy/encore server/encore_server/tests/e2e/install_e2e.sh
          bash -n server/encore_server/deploy/install.sh
          bash -n server/encore_server/deploy/encore
          bash -n server/encore_server/tests/e2e/install_e2e.sh

  encore-server-navidrome:
    # The keeper, the scanner link and the refs against a real Navidrome (docs/tasks P2-01 acceptance).
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Real music server, real ffmpeg
        working-directory: server/encore_server
        run: docker compose -f tests/integration/compose.yaml up --build --abort-on-container-exit --exit-code-from tests

  install-e2e:
    # The REAL install, once per door, on a clean machine, against an image built from this change (the lesson of 27 Nov 2026: two defects of the first run in the browser were invisible
    # to every stub test and found only by reading the install sequence). `install.sh` pulls the image the way a stranger's does, from a registry (a local one here), so the product has
    # no test-only flag. Engineering proof of the sequence, NOT a walked row: P3-07's walk of both doors by hand is still owed.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        door: [browser, headless]
    steps:
      - uses: actions/checkout@v7
      - name: A local registry for the image
        run: docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2
      - name: Build this change's image and push it there
        run: |
          docker build -t localhost:5000/encore-server:ci server/encore_server
          docker push localhost:5000/encore-server:ci
      - name: Install by the ${{ matrix.door }} door and walk the first run
        run: sudo bash server/encore_server/tests/e2e/install_e2e.sh ${{ matrix.door }} localhost:5000/encore-server ci
