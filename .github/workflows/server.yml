name: Server

on:
  push:
    branches: [main]
    paths: ['server/**', 'packages/**', 'tools/gen_admin_tokens.py', 'app/lib/design/tokens.dart', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'packages/**', 'tools/gen_admin_tokens.py', 'app/lib/design/tokens.dart', '.github/workflows/server.yml']

# The older services (fetch, people, admin, quality, recs) and the Jam hub are tested by server-legacy.yml, only when their own folder changes (D-44).

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encore-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: server/encore_server
        run: pip install -e '.[youtube,dev]'
      - name: Lint, types, tests
        working-directory: server/encore_server
        run: |
          ruff check .
          ruff format --check .
          mypy encore_server
          pytest

  install-scripts:
    # The installer and the encore command run on other people's computers: they must at least be free of the mistakes a checker finds.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck server/encore_server/deploy/install.sh server/encore_server/deploy/encore
          bash -n server/encore_server/deploy/install.sh
          bash -n server/encore_server/deploy/encore

  encore-server-navidrome:
    # The keeper, the scanner link and the refs against a real Navidrome (docs/tasks P2-01 acceptance).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Real music server, real ffmpeg
        working-directory: server/encore_server
        run: docker compose -f tests/integration/compose.yaml up --build --abort-on-container-exit --exit-code-from tests
