name: Server

# Runner: `ubuntu-26.04` on purpose, not `ubuntu-latest`. GitHub moves that label from 24.04 to 26.04 during November 2026; naming the image makes a
# change of image a pull request that is tested, not a surprise on some run. When GitHub announces the end of the 26.04 image, move it here on
# purpose (all workflows, one pull request; reminder: `docs/roadmap/notes/P0-11`).

on:
  push:
    branches: [main]
    paths: ['server/**', 'packages/**', 'tools/gen_admin_tokens.py', 'app/lib/design/tokens.dart', 'app/test/fixtures/deezer/**', 'app/test/fixtures/server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'packages/**', 'tools/gen_admin_tokens.py', 'app/lib/design/tokens.dart', 'app/test/fixtures/deezer/**', 'app/test/fixtures/server/**', '.github/workflows/server.yml']
# `app/test/fixtures/deezer/` (the 20 recorded searches) and `app/test/fixtures/server/` (answers the server's own tests write and compare) are read by BOTH suites:
# a change to them must run this workflow as well as the app's (docs/30 section I).

# The older services (fetch, people, admin, quality, recs) and the Jam hub are tested by server-legacy.yml, only when their own folder changes (D-44).

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encore-server:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        working-directory: server/encore_server
        run: pip install -e '.[youtube,dev]'
      - name: Lint, types, tests
        working-directory: server/encore_server
        run: |
          ruff check .
          ruff format --check .
          mypy encore_server
          pytest

  install-scripts:
    # The installer and the encore command run on other people's computers: they must at least be free of the mistakes a checker finds.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck server/encore_server/deploy/install.sh server/encore_server/deploy/encore
          bash -n server/encore_server/deploy/install.sh
          bash -n server/encore_server/deploy/encore

  encore-server-navidrome:
    # The keeper, the scanner link and the refs against a real Navidrome (docs/tasks P2-01 acceptance).
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Real music server, real ffmpeg
        working-directory: server/encore_server
        run: docker compose -f tests/integration/compose.yaml up --build --abort-on-container-exit --exit-code-from tests
