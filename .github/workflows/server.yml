name: Server

on:
  push:
    branches: [main]
    paths: ['server/**', 'packages/**', 'tools/gen_admin_tokens.py', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'packages/**', 'tools/gen_admin_tokens.py', '.github/workflows/server.yml']

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [encore-fetch, encore-people, encore-admin, encore-quality, encore-recs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (${{ matrix.service }})
        working-directory: server/legacy/${{ matrix.service }}
        run: python -m unittest discover -s tests

  encore-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: server/encore_server
        run: pip install -e '.[youtube,dev]'
      - name: Lint, types, tests
        working-directory: server/encore_server
        run: |
          ruff check .
          ruff format --check .
          mypy encore_server
          pytest

  encore-server-navidrome:
    # The keeper, the scanner link and the refs against a real Navidrome (docs/tasks P2-01 acceptance).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Real music server, real ffmpeg
        working-directory: server/encore_server
        run: docker compose -f tests/integration/compose.yaml up --build --abort-on-container-exit --exit-code-from tests

  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Analyze and test the Jam hub
        working-directory: server/legacy/hub
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
