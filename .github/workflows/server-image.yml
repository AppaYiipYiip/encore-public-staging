name: Server image

# Builds the Encore server image and publishes it to GitHub's container registry (private while the repository is private):
# `ghcr.io/appayiipyiip/encore-server:main` for the newest main, and `:sha-<commit>` for every build. The installer
# (server/encore_server/deploy/install.sh) pulls it. 64-bit Intel/AMD only for now; arm64 comes later.
on:
  push:
    branches: [main]
    paths: ['server/encore_server/**', '.github/workflows/server-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/encore-server
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Encore server
            org.opencontainers.image.description=The Encore music server: songs as references, playlists, likes and the live channel, in front of a music server.

      - uses: docker/build-push-action@v6
        with:
          context: server/encore_server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
