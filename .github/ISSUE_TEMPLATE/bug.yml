name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for writing this down. The maintainers keep their own list of work on a board outside GitHub, and copy every report onto it; you do not need to do anything else; we reply here when we can.
  - type: textarea
    id: did
    attributes:
      label: What I did
      description: Steps, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Screenshot or log if you have one. Never include a password.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Device and setup
      description: Phone model, Android version, navigation (3-button or gesture), font scale, network, server version, app version.
  - type: textarea
    id: details
    attributes:
      label: Technical details from the app
      description: >-
        In Encore: Settings > About & credits > Diagnostics > the copy icon at the top right, then paste it here. It holds the app version,
        your phone and the last lines of what the app did. Look it over first: it names your server, and lines of the log can hold an
        address; remove what you do not want to share.
      render: text
  - type: dropdown
    id: freq
    attributes:
      label: How often
      options: [Always, Often, Sometimes, Once]
