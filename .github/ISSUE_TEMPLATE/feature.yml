name: Feature request
description: An idea, written as a story
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for writing this down. The maintainers keep their own list of work on a board outside GitHub, and copy every report onto it; you do not need to do anything else; we reply here when we can.
  - type: textarea
    id: story
    attributes:
      label: As a ... I want ... so that ...
      description: See docs/03a-user-stories.md for the style.
    validations:
      required: true
  - type: textarea
    id: ok
    attributes:
      label: How would we know it works?
      description: What a person sees, with numbers where it matters.
