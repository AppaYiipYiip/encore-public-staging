[project]
name = "encore-server"
version = "0.1.0"
description = "The Encore server: one program for a person's music library, playback state, imports and streaming (docs/04)."
# Exactly Python 3.12, on purpose (P2-25): the song keys are pinned to Unicode 15.0.0 = Python 3.12 = the image (`python:3.12-slim`), and the server refuses to start on any
# other (`textnorm.require_pinned_unicode`). To move: image, server.yml, this line and `textnorm.UNICODE_VERSION` together (tests/test_unicode_pin.py; docs/18, "the Unicode pin").
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  # The server's identity: an Ed25519 key pair (docs/11 ADR-R40). Apache-2.0 OR BSD-3-Clause; wheels for x86-64 and aarch64.
  "cryptography>=43",
  # The backups are encrypted to a public key kept on the computer (P3-30): age (X25519), the standard format, in Rust. MIT; abi3 wheels for Windows, x86-64 and aarch64 Linux.
  "pyrage>=1.2",
  # The Host's time zone ("today" on Home is counted in it, N-53's neighbour): `zoneinfo` needs the zone data, and a slim container image may not have the operating system's. Public domain data.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
youtube = ["yt-dlp", "ytmusicapi", "mutagen"]
dev = ["pytest>=8", "hypothesis>=6", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["encore_server*"]

[tool.setuptools.package-data]
encore_server = ["migrations/*.sql", "web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` (not `python -m pytest`) does not put the project folder on the path, and the tests import each other as `tests.<name>`.
pythonpath = ["."]
addopts = "-q -m 'not integration'"
markers = [
  "integration: needs a real Navidrome (tests/integration/compose.yaml)",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
