<!doctype html>
<html lang="en" data-theme="dark" data-ts="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encore, direction C: Warm home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500..700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* =====================================================================
   TOKENS  (names follow app/lib/design/tokens.dart; additions are marked NEW)
   Dark is the default. Light is a full second set.
   ===================================================================== */
:root,[data-theme="dark"]{
  /* colour: surfaces (warm espresso instead of cold black) */
  --bg:#1A1411;            /* EncoreColors.bg */
  --surface:#251C17;       /* surface */
  --surface-high:#33261F;  /* surfaceHigh */
  --outline:#4B3B31;       /* outline: dividers only */
  --outline-strong:#8A7566;/* NEW: borders of fields and ghost buttons, 3:1 or better */
  --on-bg:#FFF4EA;         /* onBg: warm white */
  --on-bg-muted:#D9C8BA;   /* onBgMuted: solid, not alpha, so the ratio is exact */
  --on-bg-faint:#B09E90;   /* onBgFaint */
  --accent:#FFA55E;        /* accent: apricot, the colour of this server */
  --on-accent:#2B1405;     /* onAccent */
  --danger:#FF8A7A;
  --warning:#FFC857;
  --ok:#86D6A5;            /* NEW: "working" */
  --server:#FFA55E;        /* NEW: identity colour chosen at setup; accent = ensureContrast(server, bg) */
  --focus:#FFF4EA;         /* NEW: focus ring (X and T) */
  --focus-halo:rgba(255,244,234,.28); /* NEW */
  --scrim:rgba(20,14,11,.74);         /* NEW: under text on artwork */
  --stage:#0E0A08;         /* viewer only, not a product token */
  --ill-a:#33261F;         /* NEW: illustration tone 1 (surface-high) */
  --ill-b:#4B3B31;         /* NEW: illustration tone 2 (outline) */
  --ill-c:var(--server);   /* NEW: illustration accent (a state colour inside waiting / cannot play) */
  --shadow:0 10px 28px rgba(0,0,0,.45);
  /* spacing (Space.*, plus NEW 3xl) */
  --sp-xxs:2px;--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:24px;--sp-xxl:32px;--sp-3xl:48px;
  /* radii (Radii.*, rounder: this is the "warm" part) */
  --r-art:10px;   /* was 4 */
  --r-card:20px;  /* was 8 */
  --r-hero:28px;  /* was 12 */
  --r-sheet:28px; /* was 20 */
  --r-chip:14px;  /* NEW */
  --r-pill:999px;
  /* motion (Motion.*) */
  --m-quick:120ms;--m-standard:220ms;--m-emph:320ms;--m-colour:450ms;
  --ease:cubic-bezier(.215,.61,.355,1); /* easeOutCubic */
  --m-drift:48s;    /* NEW: cover wall, one screen width */
  --m-breathe:2600ms;/* NEW: slow halo on a waiting song */
  /* type */
  --font-ui:"Figtree","Noto Sans Arabic","Segoe UI",system-ui,sans-serif;
  --font-display:"Fraunces","Noto Sans Arabic",Georgia,"Times New Roman",serif;
  --ts:1;
  --tsl:1;  /* NEW: display and title sizes grow less than body text (nonlinear font scaling, as Android 14 does) */
}
:root[data-theme="light"],[data-theme="light"]{
  --bg:#FFF9F2;--surface:#F6EBDD;--surface-high:#EDDDCB;--outline:#D8C3AC;--outline-strong:#7A6657;
  --on-bg:#2A1E17;--on-bg-muted:#66534A;--on-bg-faint:#6B5849;
  --accent:#9E4308;--on-accent:#FFFFFF;--danger:#A82015;--warning:#7A4800;--ok:#14602F;
  --server:#FFA55E;--focus:#2A1E17;--focus-halo:rgba(42,30,23,.18);--scrim:rgba(255,249,242,.82);
  --stage:#E4D5C4;--ill-a:#EDDDCB;--ill-b:#D8C3AC;--shadow:0 10px 24px rgba(74,48,28,.18);
}
html[data-ts="2"]{--ts:2;--tsl:1.5}

/* =====================================================================
   VIEWER CHROME (not part of the product)
   ===================================================================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--stage);color:var(--on-bg);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
select,input{font:inherit}
.vb{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--outline);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.vb .brand{display:flex;align-items:center;gap:8px;font-weight:700;margin-inline-end:6px}
.vb .brand i{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
.vb .brand i b{display:block;width:4px;border-radius:2px;background:var(--accent)}
.vb label,.vb .lab{color:var(--on-bg-muted);font-size:12px;font-weight:600}
.vb select{background:var(--surface-high);color:var(--on-bg);border:1px solid var(--outline-strong);border-radius:10px;padding:6px 8px;min-height:34px;max-width:230px}
.seg{display:inline-flex;border:1px solid var(--outline-strong);border-radius:10px;overflow:hidden}
.seg button{padding:6px 11px;min-height:32px;font-weight:600;font-size:13px;color:var(--on-bg-muted);border-inline-start:1px solid var(--outline)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.vb :is(button,select,a):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vb .grp{display:inline-flex;align-items:center;gap:6px}
.vb .pages{display:flex;gap:4px;margin-inline-start:auto}
.vb .pages button{padding:6px 12px;border-radius:10px;font-weight:600;font-size:13px;color:var(--on-bg-muted)}
.vb .pages button[aria-pressed="true"]{background:var(--surface-high);color:var(--on-bg);box-shadow:inset 0 -2px 0 var(--accent)}
body.nobar .vb{display:none}
#stage{padding:18px 18px 60px;min-height:70vh}
.fgroup{display:flex;flex-wrap:wrap;gap:26px 30px;align-items:flex-start}
.fitem{display:flex;flex-direction:column;gap:8px}
.fcap{font-size:12.5px;color:var(--on-bg-muted);display:flex;flex-wrap:wrap;gap:4px 12px;max-width:100%}
.fcap b{color:var(--on-bg);font-weight:700}
.fwrap{position:relative;direction:ltr;flex:none}
.fwrap>.frame{position:absolute;inset-block-start:0;inset-inline-start:0;transform-origin:0 0}
.fnote{font-size:12.5px;line-height:1.45;color:var(--on-bg-muted);max-width:760px;border-inline-start:3px solid var(--accent);padding:2px 12px}
.fnote b{color:var(--on-bg)}
.legend{font-size:12.5px;line-height:1.5;color:var(--on-bg-muted);max-width:1100px;background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:8px 12px}
.legend kbd{font:600 11.5px var(--font-ui);background:var(--surface-high);border:1px solid var(--outline-strong);border-radius:6px;padding:1px 6px;color:var(--on-bg)}

/* =====================================================================
   FRAME BASICS (class tokens: C compact, X expanded, T ten-foot in dp)
   ===================================================================== */
.frame{position:relative;overflow:hidden;background:var(--bg);color:var(--on-bg);font-family:var(--font-ui);font-size:var(--fs-body);line-height:1.35;flex:none;
  --fs-display:calc(28px*var(--tsl));--fs-title-l:calc(22px*var(--tsl));--fs-title:calc(17px*var(--ts));--fs-body:calc(15px*var(--ts));--fs-label:calc(14px*var(--ts));--fs-caption:calc(12px*var(--ts));--fs-tab:calc(11.5px*var(--tsl));
  --hit:48px;--gutter:16px}
.frame.C{width:360px;height:800px;border-radius:38px;box-shadow:0 0 0 1px var(--outline)}
.frame.X{width:1280px;height:800px;border-radius:14px;box-shadow:0 0 0 1px var(--outline);
  --fs-display:calc(34px*var(--tsl));--fs-title-l:calc(24px*var(--tsl));--fs-body:calc(14px*var(--ts));--fs-label:calc(14px*var(--ts));--hit:40px;--gutter:28px}
.frame.T{width:960px;height:540px;border-radius:0;
  --fs-display:calc(44px*var(--tsl));--fs-title-l:calc(30px*var(--tsl));--fs-title:calc(22px*var(--ts));--fs-body:calc(18px*var(--ts));--fs-label:calc(18px*var(--ts));--fs-caption:calc(15px*var(--ts));--hit:56px;--gutter:48px;
  --focus-w:4px}
.frame[dir="rtl"]{text-align:start}
.frame *{min-width:0}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:18px;height:18px}.ic.l{width:32px;height:32px}.ic.xl{width:40px;height:40px}
.frame.T .ic{width:28px;height:28px}.frame.T .ic.s{width:22px;height:22px}.frame.T .ic.l{width:40px;height:40px}
.flip{transform:scaleX(1)}
[dir="rtl"] .flip{transform:scaleX(-1)}
.ill{width:100%;height:auto;display:block}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.grow{flex:1 1 0}
.gap-xs{gap:var(--sp-xs)}.gap-sm{gap:var(--sp-sm)}.gap-md{gap:var(--sp-md)}.gap-lg{gap:var(--sp-lg)}.gap-xl{gap:var(--sp-xl)}
.wrapx{flex-wrap:wrap}
.muted{color:var(--on-bg-muted)}.faint{color:var(--on-bg-faint)}
.t-display{font:600 var(--fs-display)/1.12 var(--font-display);letter-spacing:-.01em;margin:0}
.t-title-l{font:600 var(--fs-title-l)/1.18 var(--font-display);margin:0}
.t-title{font:700 var(--fs-title)/1.25 var(--font-ui);margin:0}
.t-body{font:400 var(--fs-body)/1.4 var(--font-ui)}
.t-label{font:600 var(--fs-label)/1.25 var(--font-ui)}
.t-cap{font:500 var(--fs-caption)/1.3 var(--font-ui)}
.ov{overflow-wrap:break-word}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* focus: a real ring on every control, and a drawn one (.is-focus) where the frame shows where focus is */
.frame :is(button,a,[tabindex]):focus-visible,.frame .is-focus{outline:var(--focus-w,3px) solid var(--focus);outline-offset:3px;box-shadow:0 0 0 calc(3px + var(--focus-w,3px)) var(--focus-halo);z-index:3}
.frame.T .is-focus{transform:scale(1.045);transition:transform var(--m-standard) var(--ease)}

/* buttons */
.btn{min-height:var(--hit);padding:0 var(--sp-xl);border-radius:var(--r-pill);font:600 var(--fs-label)/1.2 var(--font-ui);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--on-bg);position:relative}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--surface-high)}
.btn.ghost{box-shadow:inset 0 0 0 1.5px var(--outline-strong)}
.btn.text{color:var(--accent);padding:0 var(--sp-md)}
.btn.block{display:flex;width:100%}
.btn.danger{background:var(--danger);color:#2A0A06}
.ibtn{width:var(--hit);height:var(--hit);border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.ibtn.fill{background:var(--surface-high)}
.hit{min-height:var(--hit);display:inline-flex;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);font:700 var(--fs-caption)/1.25 var(--font-ui);background:var(--surface-high);color:var(--on-bg)}
.pill.acc{background:var(--accent);color:var(--on-accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warning) 12%,var(--surface));color:var(--warning)}
.pill.bad{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warning)}.dot.off{background:transparent;box-shadow:inset 0 0 0 2px var(--on-bg-faint)}

/* covers: generated colour art */
.cv{position:relative;overflow:hidden;border-radius:var(--r-art);aspect-ratio:1;background-size:cover;flex:none}
.cv svg{position:absolute;inset:0;width:100%;height:100%}
.cv.round{border-radius:50%}
.cv.hero{border-radius:var(--r-hero)}
.cv.card{border-radius:var(--r-card)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0;overflow:hidden;border-radius:var(--r-art);aspect-ratio:1;flex:none}
.mosaic .cv{border-radius:0;aspect-ratio:auto}
.scrimmed{position:relative}
.scrimmed::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--scrim),transparent 70%);pointer-events:none}

/* cards, rows */
.card{background:var(--surface);border-radius:var(--r-card)}
.card.high{background:var(--surface-high)}
.card.pad{padding:var(--sp-lg)}
.list-row{display:flex;align-items:center;gap:var(--sp-md);min-height:calc(var(--hit) + 8px);padding:4px 0;position:relative}
.list-row .meta{flex:1 1 0;display:flex;flex-direction:column;gap:1px}
.list-row .meta .tt{font:600 var(--fs-body)/1.25 var(--font-ui)}
.list-row .meta .st{font:400 var(--fs-caption)/1.3 var(--font-ui);color:var(--on-bg-muted)}
.sec{font:700 var(--fs-title)/1.25 var(--font-display);margin:0}
.sk{background:var(--surface-high);border-radius:8px;animation:skp 1.8s var(--ease) infinite}
.sk.r{border-radius:var(--r-art)}.sk.c{border-radius:50%}
@keyframes skp{0%,100%{opacity:.55}50%{opacity:1}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;width:16px;flex:none}
.eq i{display:block;width:3px;border-radius:2px;background:var(--accent);height:100%;transform-origin:50% 100%;animation:eqb 900ms ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-300ms}.eq i:nth-child(3){animation-delay:-600ms}
.eq.still i{animation:none}.eq.still i:nth-child(1){transform:scaleY(.5)}.eq.still i:nth-child(2){transform:scaleY(.9)}.eq.still i:nth-child(3){transform:scaleY(.65)}
@keyframes eqb{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warning) 0%,transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--warning) 22%,transparent)}}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-33.3333%,0,0)}}
@media (prefers-reduced-motion:reduce){.sk,.eq i,.breathe,.wall-in{animation:none!important}}

/* inputs */
.field{display:flex;align-items:center;gap:var(--sp-sm);min-height:calc(var(--hit) + 4px);padding:0 var(--sp-lg);border-radius:var(--r-pill);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--outline-strong);font:500 var(--fs-body)/1.3 var(--font-ui)}
.field .val{flex:1 1 0}
.field.sq{border-radius:var(--r-card)}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-inline-start:1px;animation:cr 1.1s steps(1) infinite}
@keyframes cr{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
.chip{min-height:var(--hit);display:inline-flex;align-items:center;flex:none}
.chip>span{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 var(--sp-lg);border-radius:var(--r-pill);background:var(--surface-high);font:600 var(--fs-label)/1.2 var(--font-ui)}
.chip[aria-pressed="true"]>span{background:var(--on-bg);color:var(--bg)}
.frame.T .chip>span{min-height:48px}
.track{position:relative;height:6px;border-radius:3px;background:color-mix(in srgb,var(--on-bg) 20%,transparent)}
.track.hatch{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--on-bg) 26%,transparent) 0 6px,transparent 6px 10px)}
.track>i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:3px;background:var(--on-bg)}
.track>b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--on-bg);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.4)}
[dir="rtl"] .track>b{transform:translate(50%,-50%)}
.scrub{min-height:var(--hit);display:flex;align-items:center}
.scrub .track{flex:1}
.times{display:flex;justify-content:space-between;font:500 var(--fs-caption)/1.2 var(--font-ui);color:var(--on-bg-muted);direction:ltr}

/* system bar (phone) */
.sysbar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font:600 12px var(--font-ui);flex:none;direction:ltr}
.sysbar .ic{width:14px;height:14px;stroke-width:2.4}
.sysbar .r{display:flex;gap:6px;align-items:center}
.gesture{height:16px;flex:none;display:grid;place-items:center}
.gesture i{display:block;width:110px;height:4px;border-radius:2px;background:var(--on-bg-faint)}

/* C shell */
.C .shell{display:flex;flex-direction:column;height:100%}
.C .main{flex:1 1 0;min-height:0;overflow:hidden auto;scrollbar-width:none;position:relative}
.C .main::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--outline);flex:none;padding:6px 4px 2px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:2px 0;font:600 var(--fs-tab)/1.15 var(--font-ui);color:var(--on-bg-muted);text-align:center;overflow-wrap:anywhere}
.tab .pillbg{display:grid;place-items:center;width:56px;height:30px;border-radius:15px}
.tab[aria-current="page"]{color:var(--on-bg);font-weight:700}
.tab[aria-current="page"] .pillbg{background:color-mix(in srgb,var(--accent) 24%,transparent);color:var(--accent)}

/* strips (S-90): the same shape, three different kinds */
.strip{display:flex;align-items:center;gap:var(--sp-md);padding:8px var(--sp-lg);flex:none;font:600 var(--fs-label)/1.3 var(--font-ui);flex-wrap:wrap}
.strip .msg{flex:1 1 140px}
.strip .btn{min-height:var(--hit);padding:0 var(--sp-lg);font-size:var(--fs-label)}
.strip.offline{background:var(--surface-high);color:var(--on-bg)}
.strip.offline .ic{color:var(--on-bg-muted)}
.strip.unreach{background:color-mix(in srgb,var(--warning) 20%,var(--surface));color:var(--on-bg);box-shadow:inset 0 2px 0 var(--warning)}
.strip.unreach .ic{color:var(--warning)}
.strip.unreach .btn{background:var(--warning);color:#2A1A00}
.strip.wrong{background:color-mix(in srgb,var(--danger) 18%,var(--surface));color:var(--on-bg);box-shadow:inset 0 2px 0 var(--danger)}
.strip.wrong .ic{color:var(--danger)}
.frame .strip.unreach .btn{background:var(--warning)}
.strip.wrong .btn{background:var(--danger);color:#2A0A06}
:root[data-theme="light"] .strip.wrong .btn{color:#fff}
:root[data-theme="light"] .strip.unreach .btn{color:#fff}

/* mini player (S-30) */
.mini{margin:0 8px 6px;border-radius:22px;background:var(--surface-high);position:relative;overflow:hidden;flex:none;padding:8px 8px 10px 8px;display:flex;align-items:center;gap:var(--sp-md);min-height:64px;box-shadow:var(--shadow)}
.mini .cv{width:48px;height:48px;border-radius:12px}
.mini .meta{flex:1 1 0;display:flex;flex-direction:column;gap:1px}
.mini .tt{font:700 var(--fs-label)/1.25 var(--font-ui)}
.mini .st{font:500 var(--fs-caption)/1.25 var(--font-ui);color:var(--on-bg-muted);display:flex;gap:6px;align-items:center}
.mini .prog{position:absolute;inset-inline:14px;bottom:4px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--on-bg) 18%,transparent)}
.mini .prog i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:2px;background:var(--on-bg)}
.mini.waiting .prog i{background:var(--warning)}
.mini.waiting .playb{box-shadow:inset 0 0 0 2px var(--warning)}
.mini.cant .st{color:var(--danger)}
.mini.cant .cv{filter:grayscale(.85) brightness(.8)}
.mini.other{box-shadow:inset 0 0 0 1.5px var(--accent),var(--shadow)}
.playb{background:var(--on-bg);color:var(--bg);border-radius:50%;width:var(--hit);height:var(--hit);display:grid;place-items:center;flex:none}
.playb.acc{background:var(--accent);color:var(--on-accent)}

/* =============== X shell: rail + main + player bar =============== */
.X .shell{display:grid;grid-template-columns:248px 1fr;grid-template-rows:1fr auto;height:100%}
.rail{grid-row:1 / span 2;background:var(--surface);display:flex;flex-direction:column;padding:20px 14px;gap:6px;border-inline-end:1px solid var(--outline)}
.rail .srv{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-card);background:color-mix(in srgb,var(--server) 16%,var(--surface-high));margin-bottom:12px}
.rail .srv .nm{font:700 15px/1.2 var(--font-display)}
.rail .srv .sub{font:500 12px/1.3 var(--font-ui);color:var(--on-bg-muted);display:flex;gap:6px;align-items:center}
.navi{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:14px;font:600 14px var(--font-ui);color:var(--on-bg-muted);position:relative}
.navi[aria-current="page"]{background:var(--surface-high);color:var(--on-bg);font-weight:700}
.navi[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:0;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--accent)}

.X .main{overflow:hidden auto;min-height:0;position:relative;scrollbar-width:none}

.pbar{grid-column:2;background:var(--surface);border-top:1px solid var(--outline);display:grid;grid-template-columns:1fr minmax(380px,520px) 1fr;align-items:center;gap:var(--sp-lg);padding:10px var(--gutter);min-height:84px}

/* =============== T shell =============== */

.tbody{flex:1 1 0;min-height:0;overflow:hidden;padding:0 var(--gutter);position:relative;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 30px),transparent)}
.tpbar{margin:0 var(--gutter) 24px;border-radius:var(--r-card);background:var(--surface-high);display:flex;align-items:center;gap:var(--sp-lg);padding:10px 18px;flex:none}

.key{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 6px;border-radius:7px;background:var(--surface-high);box-shadow:inset 0 0 0 1.5px var(--outline-strong);font:700 13px var(--font-ui);color:var(--on-bg)}
.tile{display:flex;flex-direction:column;gap:8px;flex:none;position:relative}

.tile .st{font:500 var(--fs-caption)/1.3 var(--font-ui);color:var(--on-bg-muted)}
.shelf{display:flex;gap:var(--sp-lg);overflow:hidden;padding:12px;margin:0 -12px}
.shelf-h{display:flex;align-items:baseline;justify-content:space-between;margin:var(--sp-lg) 0 var(--sp-sm)}
/* focus path (T): drawn arrows, not a description */
.fp{position:absolute;inset:0;pointer-events:none;z-index:6}
.fp path{fill:none;stroke:#FF4DA6;stroke-width:3;stroke-dasharray:7 6;stroke-linecap:round}

.anno{display:none}

/* =====================================================================
   HOME
   ===================================================================== */

.hh{display:flex;align-items:center;gap:var(--sp-md);padding-top:4px}
.srvcard{display:flex;align-items:center;gap:var(--sp-md);padding:14px;border-radius:var(--r-hero);background:linear-gradient(120deg,color-mix(in srgb,var(--server) 30%,var(--surface)),var(--surface) 72%);position:relative;overflow:hidden;min-height:86px;flex:none}

.srvcard.big{padding:18px 24px;min-height:116px}
.srvcard.big .srvill{width:150px;margin-block:-16px}
.scgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.scgrid.x{grid-template-columns:repeat(3,1fr);gap:12px}
.sc{display:flex;align-items:center;gap:10px;background:var(--surface-high);border-radius:var(--r-chip);overflow:hidden;min-height:56px;padding-inline-end:10px}

.shw{margin-inline:calc(var(--gutter)*-1);flex:none}
.shw .shelf-h{padding-inline:var(--gutter)}
.shw .shelf{padding:12px var(--gutter);overflow:hidden;margin:-12px 0}
.shw .shelf-h{margin:0 0 var(--sp-sm)}
.tile{position:relative}
.tile .cvo{position:absolute;top:0;inset-inline-start:0;pointer-events:none}
.bdl{position:absolute;inset-inline-end:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--ok);display:grid;place-items:center}
.tile.dim .cv{opacity:.42;filter:grayscale(.7)}
.tile.dim .tt,.tile.dim .st{opacity:.7}
.year{display:flex;align-items:center;gap:12px;padding:18px;border-radius:var(--r-hero);background:linear-gradient(120deg,var(--server),color-mix(in srgb,var(--server) 55%,#FF7A7A));color:#2B1405;flex:none}
.start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 0 0}
.startill{width:200px}
.start .act{width:100%}
.act{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:calc(var(--hit) + 16px);background:var(--surface);border-radius:var(--r-card);text-align:start}
.actic{width:44px;height:44px;flex:none;border-radius:14px;background:color-mix(in srgb,var(--accent) 22%,var(--surface-high));color:var(--accent);display:grid;place-items:center}
.xp{padding:24px var(--gutter) 28px;display:flex;flex-direction:column;gap:var(--sp-xl)}
.xp .start{flex-direction:row;text-align:start;align-items:center;gap:var(--sp-xl);flex-wrap:wrap}
.xp .start>*{flex:1 1 300px}
.xp .startill{flex:0 0 220px;width:220px}
.xp .start .act{width:auto}
.list-row .cv{width:48px;height:48px}
.X .list-row .cv{width:44px;height:44px}
.T .list-row .cv{width:64px;height:64px}
.cvsk{width:48px;height:48px;flex:none}
.nowmark{position:absolute;inset-inline-start:-14px}
.lb{animation:lbar 1.1s ease-in-out infinite}
@keyframes lbar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.lb{animation:none}}
.fpk{position:absolute;z-index:7;pointer-events:none;display:inline-flex}
.fpk b{background:#FF4DA6;color:#1B0610;font:800 13px/1 var(--font-ui);padding:5px 8px;border-radius:8px;box-shadow:0 0 0 2px #1B0610}
.fpk.r{inset-inline-end:-40px;top:56px}
.fpk.l{inset-inline-start:-40px;top:56px}
.fpk.d{bottom:-22px;inset-inline-start:calc(50% - 14px)}
.fpk.u{top:-22px;inset-inline-start:calc(50% - 14px)}
.btn .fpk{inset-inline-end:-44px;top:calc(50% - 12px)}

/* =====================================================================
   Pages: Tokens and Why
   ===================================================================== */
.page{max-width:1100px;margin:0 auto;color:var(--on-bg);font-size:calc(15px*var(--ts));line-height:1.5;--fs-display:calc(34px*var(--tsl));padding-bottom:40px}
.page h1{margin:6px 0 10px}
.page h2{font:600 calc(22px*var(--tsl))/1.2 var(--font-display);margin:34px 0 10px;border-bottom:1px solid var(--outline);padding-bottom:6px}
table.tt{border-collapse:collapse;width:100%;font-size:calc(13px*var(--ts))}
.tt th{text-align:start;color:var(--on-bg-muted);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--outline-strong)}
.tt td{padding:6px 10px;border-bottom:1px solid var(--outline);vertical-align:middle}
.swc{display:inline-block;width:22px;height:22px;border-radius:7px;vertical-align:middle;margin-inline-end:8px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.55)}
.pass b{color:var(--ok)}.fail b{color:var(--danger)}
code{font:12.5px ui-monospace,Consolas,monospace;background:var(--surface-high);padding:1px 6px;border-radius:6px;color:var(--on-bg)}
.swrow{display:flex;flex-wrap:wrap;gap:22px}
.swbox{display:flex;flex-direction:column;gap:4px;font-size:13px}
.rules li{margin:6px 0}
.why p{max-width:1100px;margin:6px 0;font-size:calc(15.5px*var(--ts));display:grid;grid-template-columns:170px 1fr;gap:12px}
.why p b{color:var(--accent)}
#stage.pagemode{padding-top:26px}
.year.tall{flex-direction:column;align-items:flex-start;justify-content:space-between;flex:none}
.year.tall svg{align-self:flex-end}
.T .tbody .shelf{margin-inline-end:calc(var(--gutter)*-1)}
.fpk.r{inset-inline-end:-20px}
.fpk.l{inset-inline-start:-20px}
.fpk.d{bottom:4px;inset-inline-end:8px;inset-inline-start:auto}

html[data-ts="2"] .C .scgrid{grid-template-columns:1fr}
html[data-ts="2"] .C .tile .tt{font-size:calc(15px*1.5)}

/* =====================================================================
   NOW PLAYING
   ===================================================================== */
.shell.nps{background:linear-gradient(180deg,color-mix(in srgb,var(--tint,#555) 58%,var(--bg)) 0,var(--bg) 78%)}
.C .npmain{display:flex;flex-direction:column}
.np{display:flex;flex-direction:column;gap:var(--sp-xs);padding:0 var(--gutter) 6px;height:100%;min-height:max-content}
.nptop{display:flex;align-items:center;gap:var(--sp-sm);flex:none}
.npcov{flex:1 1 0;min-height:120px;display:grid;place-items:center;padding:2px 0}
.npc{aspect-ratio:1;height:100%;max-width:100%;border-radius:var(--r-hero);box-shadow:var(--shadow);position:relative;overflow:hidden;justify-self:center}
.npc .cv{position:absolute;inset:0}
.npc.gray .cv{filter:grayscale(.92) brightness(.72)}

.npc.remote .cv{border-radius:var(--r-hero)}
.nptitle{display:flex;align-items:flex-start;gap:var(--sp-sm);flex:none}
.nptitle h1{margin:0}
.artists{display:flex;flex-wrap:wrap;align-items:center;font:600 var(--fs-body)/1.2 var(--font-ui);color:var(--on-bg-muted)}
.artists{gap:6px}
.alink{min-height:var(--hit);display:inline-flex;align-items:center;color:var(--on-bg);position:relative;border-radius:var(--r-pill)}
.ach{display:inline-flex;align-items:center;gap:8px;padding:3px 14px 3px 3px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--on-bg) 13%,transparent);font:600 var(--fs-body)/1.2 var(--font-ui);min-height:36px;overflow-wrap:anywhere}
[dir="rtl"] .ach{padding:3px 3px 3px 14px}
.T .ach{min-height:48px;padding-inline-end:20px}
.T .alink{min-height:52px}
.tport{display:flex;align-items:center;justify-content:space-between;direction:ltr;flex:none;padding:0 2px}
.X .tport,.T .tport{justify-content:flex-start;gap:var(--sp-md)}
.bigplay{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;position:relative;flex:none}
.X .bigplay{width:64px;height:64px}.T .bigplay{width:84px;height:84px}
.bigplay.wait{background:var(--surface-high);color:var(--on-bg);box-shadow:inset 0 0 0 3px var(--warning)}
.bigplay.wait::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--warning);opacity:0;animation:halo var(--m-breathe) ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.9);opacity:0}50%{transform:scale(1.1);opacity:.75}}
@media (prefers-reduced-motion:reduce){.bigplay.wait::after{animation:none;opacity:.55;transform:none}}
.dis{opacity:.4}
.notice{display:flex;gap:var(--sp-md);align-items:center;padding:var(--sp-md);border-radius:var(--r-card);background:var(--surface);flex:none}
.notice.wait{background:color-mix(in srgb,var(--warning) 14%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warning) 55%,transparent);--ill-c:var(--warning)}
.notice.bad{background:color-mix(in srgb,var(--danger) 12%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 55%,transparent);--ill-c:var(--on-bg-faint)}
.nill{width:88px;flex:none}
.X .nill{width:110px}.T .nill{width:130px}
html[data-ts="2"] .C .nill{width:56px}
.upnext{display:flex;align-items:center;gap:var(--sp-md);padding:8px 12px;border-radius:var(--r-card);background:var(--surface-high);min-height:56px;flex:none}
.devcard{display:flex;flex-direction:column;gap:var(--sp-md);padding:var(--sp-md) var(--sp-lg);border-radius:var(--r-card);background:var(--surface-high);box-shadow:inset 0 0 0 1.5px var(--accent);flex:none}
.tools{display:grid;grid-template-columns:repeat(4,1fr);flex:none}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font:600 calc(12px*var(--tsl))/1.15 var(--font-ui);color:var(--on-bg-muted);text-align:center;overflow-wrap:break-word}
.minispec{margin:0 -8px}
.minispec .mini{margin:0 8px}
.npxw{min-height:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 46%,var(--bg)) 0,var(--bg) 64%);display:flex;flex-direction:column}
.npxbody{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:var(--sp-xl);padding:22px var(--gutter);flex:1}
.npxl-wrap{display:flex;flex-direction:column;gap:var(--sp-lg);min-width:0}
.npxl{display:flex;gap:var(--sp-xl);align-items:flex-end;flex-wrap:wrap}
.npxm{display:flex;flex-direction:column;gap:var(--sp-md)}
.queue{padding:14px 18px;align-self:start}
.queue .list-row{min-height:56px}
.npt{display:flex;gap:var(--sp-xl);align-items:flex-start;padding-top:10px}
.npt .scrub{min-height:44px}
.T .notice{max-width:520px}

.T .npt{gap:var(--sp-xl);padding-top:0}
.T .npt .grow.col{gap:8px}
.T .bigplay{width:72px;height:72px}
.T .nill{width:84px}

/* =====================================================================
   SEARCH and ARTIST
   ===================================================================== */
.spad{padding:4px var(--gutter) 14px;display:flex;flex-direction:column;gap:var(--sp-sm)}

.apmain{padding:0!important}
.apage{display:flex;flex-direction:column;min-height:100%}
.ahero{position:relative;overflow:hidden;flex:none}
.ahero .cv{position:absolute;inset:0;border-radius:0}
.ascrim{position:absolute;inset:0;background:linear-gradient(0deg,var(--scrim) 0,var(--scrim) 36%,transparent 100%)}

.grid2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:var(--sp-xxl)}
.grid2n{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:var(--sp-xxl)}

.k{display:grid;place-items:center;height:calc(var(--hit) - 6px);border-radius:12px;background:var(--surface-high);font:700 var(--fs-label) var(--font-ui);color:var(--on-bg)}
.k.wide{flex:1;padding:0 20px}
.res{flex:1 1 0;min-width:0}
.t-art{display:flex;flex-direction:column;height:100%}

/* =====================================================================
   WELCOME
   ===================================================================== */
.wsh{display:flex;flex-direction:column;height:100%}

.wb{display:flex;flex-direction:column;gap:var(--sp-md)}
.wb h1{margin:0}
.wbill{width:150px;align-self:center;margin-bottom:-4px}
.more{display:flex;align-items:center;gap:12px;min-height:var(--hit);padding:0 4px;color:var(--on-bg)}
.srvopt{display:flex;flex-direction:column;gap:var(--sp-md);padding:var(--sp-lg);border-radius:var(--r-card);background:color-mix(in srgb,var(--server) 14%,var(--surface-high));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--server) 50%,transparent);height:100%}
.vf{position:relative;height:200px;border-radius:var(--r-card);overflow:hidden;background:radial-gradient(circle at 50% 40%,#3A2B20,#120D0A);flex:none}
.vfin{position:absolute;inset:30px 52px;display:grid;place-items:center}

.vfin .c3{bottom:0;inset-inline-start:0;border-block-end-width:4px;border-inline-start-width:4px}
.vfin .c4{bottom:0;inset-inline-end:0;border-block-end-width:4px;border-inline-end-width:4px}
.scanline{position:absolute;inset-inline:8px;top:18%;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:scan 2.4s ease-in-out infinite alternate}

.qrdim{color:#FFF4EA;opacity:.4;--qrbg:#241911}
.vfp{position:absolute;top:10px;inset-inline-start:10px}
.alertp{display:flex;gap:var(--sp-md);align-items:center;padding:var(--sp-md);border-radius:var(--r-card);background:color-mix(in srgb,var(--danger) 12%,var(--surface-high));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 55%,transparent);--ill-c:var(--on-bg-faint)}
.shell.wx{display:grid;grid-template-columns:1fr 1fr;height:100%}
.wx .wleft{position:relative;overflow:hidden;background:var(--surface)}
.wx .wbrand{bottom:48px;inset-inline:48px}
.wx .wright{display:grid;place-items:center;background:var(--surface);padding:24px;overflow:hidden}
.wx .wcard{width:440px;max-width:100%}
.T .shell.wt{padding:0;position:relative}
.wt .wcard{width:470px}
.wt .wright{padding:var(--gutter) 40px}
.wt .hintbar{position:absolute;inset-inline-start:calc(50% + 40px);bottom:12px;padding:0}
.qrbox{padding:12px;background:var(--on-bg);color:var(--bg);--qrbg:var(--on-bg);border-radius:var(--r-card);flex:none;line-height:0}
.codeb{font:700 calc(40px*var(--ts)) var(--font-display);letter-spacing:.08em;direction:ltr}

/* =====================================================================

'use strict';
/* ------------------------------------------------------------------
   Viewer state. The URL hash carries it, so a frame can be linked:
   #s=home&st=full&c=C&th=dark&tx=1&d=ltr&n=0&bar=1&p=screens
   ------------------------------------------------------------------ */
const DEF={p:'screens',s:'home',st:'full',c:'C',th:'dark',tx:'1',d:'ltr',n:'0',bar:'1'};
const Q=Object.assign({},DEF);
function readURL(){
  const raw=(location.hash||'').replace(/^#/,'')||(location.search||'').replace(/^\?/,'');
  const u=new URLSearchParams(raw);
  for(const k of Object.keys(DEF)){ if(u.has(k)) Q[k]=u.get(k); }
}
function writeURL(){
  const u=new URLSearchParams();
  for(const k of Object.keys(DEF)){ if(Q[k]!==DEF[k]) u.set(k,Q[k]); }
  const h='#'+u.toString();
  if(location.hash!==h) history.replaceState(null,'',h||'#');
}
const rtl=()=>Q.d==='rtl';

 "Home":"الرئيسية","Search":"بحث","Library":"المكتبة","People":"الأشخاص","Fairouz":"فيروز",

function srvBadge(st,px){
  if(st==='wrong') return `<span class="bpair">${badge(SERVER.col,px)}${badge('#8A7F78',Math.round(px*.52),'stranger')}</span>`;

/* The Encore mark: sound bars (placeholder, the logo is not decided). Moves only on Welcome. */

  return `<svg width="${px}" height="${px}" viewBox="0 0 32 40" aria-hidden="true">${bars.map(([x,y,h],i)=>`<rect class="${anim?'lb':''}" style="${anim?`animation-delay:${-i*260}ms;`:''}transform-box:fill-box;transform-origin:50% 100%" x="${x}" y="${y}" width="5" height="${h}" rx="2.5" fill="var(--accent)"/>`).join('')}</svg>`;

   ------------------------------------------------------------------ */
const STRIP={
 offline:{cls:'offline',icon:'wifi-off',msg:"You're offline. Downloaded music still plays."},
 unreach:{cls:'unreach',icon:'home-off',msg:"Can't reach your server.",btn:"Try again"},
 wrong:{cls:'wrong',icon:'swap',msg:"Another server answers at this address, not yours.",btn:"Look again"}
};
function strip(kind){
  const s=STRIP[kind]; if(!s) return '';
  return `<div class="strip ${s.cls}" role="status">${ic(s.icon)}<span class="msg">${T(s.msg)}</span>${s.btn?`<button class="btn" type="button">${ic('refresh','s')}${T(s.btn)}</button>`:''}</div>`;
}

/* Mini player (S-30) in six states. The play button is always 48 px or more. */
function mini(kind,sk='wish'){
  const s=SONG[sk]; const by=artistText(s);
  const L={
   playing:{c:'',st:`${eqb()}<span class="ov">${by}</span>`,b:'pause'},
   paused:{c:'',st:`<span class="ov">${by}</span>`,b:'play'},
   buffering:{c:'',st:`<span class="ov">Starting…</span>`,b:'pause'},
   waiting:{c:'waiting',st:`${ic('home-off','s')}<span class="ov">Waiting for your server</span>`,b:'play'},
   cant:{c:'cant',st:`${ic('warning','s')}<span class="ov">Couldn't play this song</span>`,b:'next'},
   other:{c:'other',st:`${ic('tv','s')}<span class="ov">Playing on Living room TV</span>`,b:'pause'}
  }[kind];
  return `<a class="mini ${L.c}" href="#" data-go="now/${kind==='waiting'?'waiting':kind==='cant'?'cant':kind==='other'?'other':'playing'}">
    ${cvx(s.cv)}<div class="meta"><div class="tt one">${esc(s.t)}</div><div class="st">${L.st}</div></div>
    <span class="playb ${kind==='cant'?'acc':''}">${ic(L.b)}</span><div class="prog"><i style="width:${kind==='cant'?0:32}%"></i></div></a>`;
}
function sysbar(){
  return `<div class="sysbar"><span>9:41</span><span class="r">${ic('signal')}${ic('battery')}</span></div>`;
}
function tabs(active){
  const items=[['home','Home','home/full'],['search','Search','search/top'],['library','Library',''],['people','People','']];
  return `<nav class="tabs" aria-label="Main">${items.map(([k,l,go])=>`<a class="tab" href="#" ${go?`data-go="${go}"`:''} ${k===active?'aria-current="page"':''}><span class="pillbg">${ic(k==='home'&&k===active?'home-fill':k)}</span><span>${T(l)}</span></a>`).join('')}</nav>`;
}
function shellC(main,o={}){
  return `<div class="shell ${o.cls||''}" ${o.style?`style="${o.style}"`:''}>${sysbar()}${o.top||''}<div class="main ${o.mainCls||''}">${main}</div>${o.strip||''}${o.mini||''}${o.tabs===false?'':tabs(o.tab||'home')}<div class="gesture"><i></i></div></div>`;
}

/* X: side rail with the server at the top */
function rail(active,st){
  const dot=st==='unreach'||st==='wrong'?'<span class="dot warn"></span>':st==='offline'?'<span class="dot off"></span>':'<span class="dot"></span>';
  const word=st==='unreach'?'Not answering':st==='offline'?'Offline':st==='wrong'?'Check this address':'Working';
  const items=[['home','Home'],['search','Search'],['library','Library'],['people','People']];
  const lists=[['Liked Songs','liked'],['Fairouz in the morning','kifak'],['Late night Berlin','night'],['Rainy day','rain']];
  return `<aside class="rail" aria-label="Main">
    <a class="srv" href="#" data-go="server/ok">${srvBadge(st,44)}<div class="grow"><div class="nm">${T("Riley's Music")}</div><div class="sub">${dot}<span>${T(word)}</span></div></div></a>
    ${items.map(([k,l])=>`<a class="navi" href="#" ${k==='home'?'data-go="home/full"':k==='search'?'data-go="search/top"':''} ${k===active?'aria-current="page"':''}>${ic(k==='home'&&k===active?'home-fill':k)}<span>${T(l)}</span></a>`).join('')}
    <div class="hd">${T("Your playlists")}</div>
    ${lists.map(([l,k])=>`<a class="navi" href="#" style="min-height:44px;font-weight:500">${cvs(k,28)}<span class="ov">${T(l)}</span></a>`).join('')}

  </aside>`;
}

  const badgeHtml=(o.badge||'')+(o.dl?`<span class="bdl">${ic('downloaded','s')}</span>`:'');
  return `<a class="tile ${o.dim?'dim':''}" href="#" ${o.go?`data-go="${o.go}"`:''} style="width:${w}px">${cvx(k,'card'+(o.f?' is-focus':''),`width:${w}px;height:${w}px`)}<div class="cvo" style="width:${w}px;height:${w}px">${badgeHtml}</div><div class="tt ov">${t}</div><div class="st ov">${s}</div>${o.extra||''}</a>`;
}
function songRow(id,o={}){
  const s=SONG[id];
  const trail=(o.dl?`<span class="dlmark" title="Downloaded">${ic('downloaded','s')}</span>`:'')+`<span class="ibtn">${ic('more')}</span>`;
  const by=o.by||`${artistText(s)} · ${esc(s.al)}`;
  return `<a class="list-row ${o.f?'is-focus':''}" href="#" ${o.go?`data-go="${o.go}"`:''}>${o.now?`<span class="nowmark">${eqb()}</span>`:''}${cvx(s.cv,'','')}<div class="meta"><div class="tt ov">${esc(s.t)}</div><div class="st ov">${by}</div></div><span class="t-cap muted dur" style="direction:ltr">${s.d}</span>${trail}${o.tag?`<span class="anno" style="top:0;inset-inline-start:62px">${o.tag}</span>`:''}</a>`;
}

/* ------------------------------------------------------------------
   Frames: true size, scaled to fit, with a label that says the scale
   ------------------------------------------------------------------ */
const BASE={C:[360,800,1],X:[1280,800,1],T:[960,540,2]};
const SIZELABEL={C:'C compact phone · 360 × 800 dp',X:'X expanded browser · 1280 × 800 dp',T:'T ten-foot TV · 1920 × 1080 px = 960 × 540 dp at 2×'};
function frameBox(cls,inner,cap){
  const b=BASE[cls];
  return `<div class="fitem"><div class="fwrap" data-cls="${cls}" data-w="${b[0]*b[2]}" data-h="${b[1]*b[2]}" data-k="${b[2]}"><div class="frame ${cls}" dir="${Q.d}">${inner}</div></div>
   <div class="fcap"><span><b>${esc(cap.title)}</b></span><span>${SIZELABEL[cls]}</span><span class="scl" data-for="${cls}"></span></div>${cap.note?`<div class="fnote">${cap.note}</div>`:''}${cap.legend?`<div class="legend" style="max-width:${cls==='C'?360:1100}px">${cap.legend}</div>`:''}</div>`;
}
function fit(){
  const stage=document.getElementById('stage'); if(!stage) return;
  const avail=Math.max(300,stage.clientWidth-36);
  stage.querySelectorAll('.fwrap').forEach(w=>{
    const bw=+w.dataset.w,bh=+w.dataset.h,k=+w.dataset.k;
    const f=Math.min(1,avail/bw);
    w.style.width=(bw*f)+'px'; w.style.height=(bh*f)+'px'; w.parentElement.style.width=(bw*f)+'px';
    const fr=w.firstElementChild; fr.style.transform=`scale(${k*f})`;
    const cap=w.parentElement.querySelector('.scl');
    if(cap) cap.textContent=(f>=0.999)?'scale 100 % (true size)':`scale ${Math.round(f*100)} % of true size (fitted to the window)`;
  });
}
window.addEventListener('resize',fit);

function qrSvg(px,seed){
  const n=21; let s=seed||7; const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" rx="1.4" fill="currentColor"/><rect x="${x+1}" y="${y+1}" width="5" height="5" rx=".8" fill="var(--qrbg,#1A1411)"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".5" fill="currentColor"/>`;
  let m='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
    if(inF) continue;
    if(rnd()>.52) m+=`<rect x="${x}" y="${y}" width="1" height="1" fill="currentColor"/>`;
  }
  return `<svg width="${px}" height="${px}" viewBox="0 0 21 21" aria-hidden="true" shape-rendering="crispEdges">${fin(0,0)}${fin(14,0)}${fin(0,14)}${m}</svg>`;
}

function probeTheme(th){
  const el=document.createElement('div'); el.setAttribute('data-theme',th); el.style.cssText='position:absolute;visibility:hidden;width:0;height:0';
  document.body.appendChild(el); const cs=getComputedStyle(el);
  const g=n=>cs.getPropertyValue(n).trim();
  const out={}; ['--bg','--surface','--surface-high','--outline','--outline-strong','--on-bg','--on-bg-muted','--on-bg-faint','--accent','--on-accent','--server','--danger','--warning','--ok','--focus','--focus-halo','--scrim','--ill-a','--ill-b'].forEach(n=>out[n]=g(n));
  document.body.removeChild(el); return out;
}
const hex2=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
const lum=([r,g,b])=>{const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);};
const ratio=(a,b)=>{const la=lum(a),lb=lum(b);const hi=Math.max(la,lb),lo=Math.min(la,lb);return (hi+0.05)/(lo+0.05);};
const mixc=(a,b,pa)=>a.map((v,i)=>Math.round(v*pa+b[i]*(1-pa)));
const rgba=s=>{const m=s.match(/rgba?\(([^)]+)\)/);if(!m)return null;const p=m[1].split(',').map(x=>parseFloat(x));return {c:p.slice(0,3),a:p[3]===undefined?1:p[3]};};
const hx=c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();

  const D=probeTheme('dark'),L=probeTheme('light');
  const rows=[
   ['--bg','bg','page background (warm espresso / warm paper)','same name'],

   ['--outline','outline','dividers only (not a control boundary)','same name'],
   ['--outline-strong','NEW','border of a field or ghost button, 3:1 or better','added'],
   ['--on-bg','onBg','text','warm white, not #FFF'],
   ['--on-bg-muted','onBgMuted','secondary text','solid, not 70 % alpha, so the ratio is exact'],
   ['--on-bg-faint','onBgFaint','captions, hints','solid, kept above 4.5:1'],
   ['--accent','accent','text, icons, primary buttons (ensureContrast of the server colour)','apricot #FFA55E (was mint #19E68C)'],
   ['--on-accent','onAccent','text on accent','same name'],
   ['--server','NEW','the colour the owner picks at setup: badge, hero card tint, illustrations','added'],

   ['--warning','warning','waiting for the server, not answering','amber'],

   ['--focus','NEW','focus ring on X and T','added']
  ];
  const sw=(v)=>`<span class="swc" style="background:${v}"></span><code>${v}</code>`;
  const colourTable=`<table class="tt"><thead><tr><th>Token</th><th>Flutter</th><th>Dark</th><th>Light</th><th>Used for</th></tr></thead><tbody>${rows.map(([n,f,u,c])=>`<tr><td><code>${n}</code></td><td>${f}</td><td>${sw(D[n])}</td><td>${sw(L[n])}</td><td>${u}</td></tr>`).join('')}
   <tr><td><code>--focus-halo</code></td><td>NEW</td><td colspan="2"><code>${D['--focus-halo']}</code> / <code>${L['--focus-halo']}</code></td><td>soft glow outside the ring</td></tr>
   <tr><td><code>--scrim</code></td><td>NEW</td><td colspan="2"><code>${D['--scrim']}</code> / <code>${L['--scrim']}</code></td><td>under any text that sits on artwork</td></tr>

  /* contrast pairs, computed */
  const pairs=[
   ['on-bg','--on-bg','--bg',4.5],['on-bg','--on-bg','--surface',4.5],['on-bg','--on-bg','--surface-high',4.5],
   ['on-bg-muted','--on-bg-muted','--bg',4.5],['on-bg-muted','--on-bg-muted','--surface',4.5],['on-bg-muted','--on-bg-muted','--surface-high',4.5],
   ['on-bg-faint','--on-bg-faint','--bg',4.5],['on-bg-faint','--on-bg-faint','--surface',4.5],['on-bg-faint','--on-bg-faint','--surface-high',4.5],
   ['accent (text, icon)','--accent','--bg',4.5],['accent (text, icon)','--accent','--surface',4.5],['accent (text, icon)','--accent','--surface-high',4.5],
   ['on-accent on accent (buttons)','--on-accent','--accent',4.5],
   ['danger','--danger','--bg',4.5],['danger','--danger','--surface',4.5],['warning','--warning','--bg',4.5],['warning','--warning','--surface',4.5],['danger','--danger','--surface-high',4.5],['warning','--warning','--surface-high',4.5],['ok','--ok','--surface-high',4.5],['ok','--ok','--bg',4.5],['ok','--ok','--surface',4.5],
   ['outline-strong (field border)','--outline-strong','--bg',3],['outline-strong (field border)','--outline-strong','--surface',3],['outline-strong (on chip)','--outline-strong','--surface-high',3],
   ['focus ring','--focus','--bg',3],['focus ring','--focus','--surface',3]
  ];
  const calc=(P,f,b)=>ratio(hex2(P[f]),hex2(P[b]));
  const extra=(P,th)=>{
    const list=[];
    const wBg=mixc(hex2(P['--warning']),hex2(P['--surface']),.20);
    list.push(['on-bg on the amber strip',ratio(hex2(P['--on-bg']),wBg),4.5]);
    const wBtn=th==='dark'?'#2A1A00':'#FFFFFF';
    list.push(['button text on warning (strip button)',ratio(hex2(wBtn),hex2(P['--warning'])),4.5]);
    const dBg=mixc(hex2(P['--danger']),hex2(P['--surface-high']),.12);
    list.push(['on-bg on the red strip',ratio(hex2(P['--on-bg']),dBg),4.5]);
    list.push(['ok on the "Working" pill (12 % tint on surfaceHigh)',ratio(hex2(P['--ok']),mixc(hex2(P['--ok']),hex2(P['--surface-high']),.12)),4.5]);
    list.push(['warning on its pill',ratio(hex2(P['--warning']),mixc(hex2(P['--warning']),hex2(P['--surface-high']),.12)),4.5]);
    list.push(['danger on its pill',ratio(hex2(P['--danger']),mixc(hex2(P['--danger']),hex2(P['--surface-high']),.12)),4.5]);
    const sc=rgba(P['--scrim']);
    [['white','#FFFFFF'],['black','#000000']].forEach(([n,h])=>{const under=mixc(sc.c,hex2(h),sc.a);list.push([`on-bg on artwork with scrim (worst case: ${n} art)`,ratio(hex2(P['--on-bg']),under),4.5]);});
    return list;
  };
  const cell=(r,need)=>`<td class="${r>=need?'pass':'fail'}">${r.toFixed(2)}:1 <b>${r>=need?'✓ pass':'✗ below '+need}</b></td>`;
  const pr=pairs.map(([n,f,b,need])=>`<tr><td>${n} on <code>${b}</code></td><td>${need===3?'UI 3:1':'text 4.5:1'}</td>${cell(calc(D,f,b),need)}${cell(calc(L,f,b),need)}</tr>`).join('');
  const ed=extra(D,'dark'),el=extra(L,'light');
  const pr2=ed.map((e,i)=>`<tr><td>${e[0]}</td><td>text 4.5:1</td>${cell(e[1],e[2])}${cell(el[i][1],el[i][2])}</tr>`).join('');
  const contrast=`<table class="tt"><thead><tr><th>Pair</th><th>Needs</th><th>Dark</th><th>Light</th></tr></thead><tbody>${pr}${pr2}</tbody></table>`;

  const radii=[['--r-art','10 px (was 4)','covers in rows'],['--r-card','20 px (was 8)','cards, tiles, covers on shelves'],['--r-hero','28 px (was 12)','server card, hero, big covers'],['--r-sheet','28 px (was 20)','bottom sheets'],['--r-chip','14 px (NEW)','shortcut tiles'],['--r-pill','999 px','buttons, chips, fields']];
  const radiiHtml=`<div class="swrow">${radii.map(([n,v,u])=>`<div class="swbox"><div style="width:84px;height:62px;background:var(--surface-high);border:1.5px solid var(--outline-strong);border-radius:var(${n})"></div><code>${n}</code><span>${v}</span><span class="muted">${u}</span></div>`).join('')}</div>`;
  const sp=[['--sp-xxs',2],['--sp-xs',4],['--sp-sm',8],['--sp-md',12],['--sp-lg',16],['--sp-xl',24],['--sp-xxl',32],['--sp-3xl',48]];
  const spHtml=`<div class="col gap-sm">${sp.map(([n,v])=>`<div class="row gap-md" style="font-size:13px"><code style="width:90px">${n}</code><span style="width:44px">${v} px</span><span style="display:block;height:12px;width:${v*3}px;border-radius:6px;background:var(--accent)"></span></div>`).join('')}<div class="muted" style="font-size:13px">Page gutter: C 16 px, X 28 px, T 48 dp (the TV safe area is 5 % of 960 × 540 dp).</div></div>`;
  const type=`<table class="tt"><thead><tr><th>Role</th><th>Face</th><th>C (dp)</th><th>X (dp)</th><th>T (dp, drawn at 2×)</th></tr></thead><tbody>
   <tr><td>display</td><td>Fraunces 600</td><td>28</td><td>34</td><td>44</td></tr>
   <tr><td>title-l</td><td>Fraunces 600</td><td>22</td><td>24</td><td>30</td></tr>
   <tr><td>title / section</td><td>Figtree 700</td><td>17</td><td>17</td><td>22</td></tr>
   <tr><td>body</td><td>Figtree 400</td><td>15</td><td>14</td><td>18</td></tr>
   <tr><td>label (buttons, rows)</td><td>Figtree 600</td><td>14</td><td>14</td><td>18</td></tr>
   <tr><td>caption</td><td>Figtree 500</td><td>12</td><td>12</td><td>15</td></tr>
   <tr><td>tab label</td><td>Figtree 600</td><td>11.5</td><td>n/a</td><td>n/a</td></tr></tbody></table>
   <p class="muted" style="font-size:13px;max-width:760px">Body, label and caption sizes are <code>size × --ts</code> (the switch sets 1 or 2); display and title sizes use <code>--tsl</code>, which is 1 and 1.5 (large text grows less, as Android 14 does), and so do the tab and tool labels. At 200 % a row grows, a name wraps, a cover shrinks; nothing is cut. Figtree stays (SIL Open Font Licence, as today); Fraunces (SIL OFL) is added for the greeting, the server's name and the headings, and Noto Sans Arabic (SIL OFL) is the Arabic fallback. Both come from the Google Fonts stylesheet.</p>`;
  const motion=`<table class="tt"><thead><tr><th>What moves</th><th>Token</th><th>Time</th><th>Under "Remove animations"</th></tr></thead><tbody>
   <tr><td>press, toggle, tab change</td><td><code>--m-quick</code></td><td>120 ms</td><td>no change of size, colour only</td></tr>
   <tr><td>sheet, card expand, focus lift on T (4.5 % scale)</td><td><code>--m-standard</code></td><td>220 ms</td><td>cross-fade</td></tr>
   <tr><td>cover grows into its page (shared element)</td><td><code>--m-emph</code></td><td>320 ms</td><td>cross-fade</td></tr>
   <tr><td>player tint changes with the song</td><td><code>--m-colour</code></td><td>450 ms</td><td>instant</td></tr>
   <tr><td>cover wall on Welcome, one screen width</td><td><code>--m-drift</code></td><td>48 s, transform only</td><td>still</td></tr>
   <tr><td>sound bars on the logo (Welcome) and on the playing row</td><td>n/a</td><td>0.9 s loop, 3 bars, transform only</td><td>still bars</td></tr>
   <tr><td>slow halo around a song that waits for the server</td><td><code>--m-breathe</code></td><td>2.6 s loop on one button</td><td>still ring (the colour stays)</td></tr>
   <tr><td>skeleton pulse</td><td>n/a</td><td>1.8 s opacity only</td><td>still</td></tr></tbody></table>
   <p class="muted" style="font-size:13px;max-width:760px">Easing is <code>cubic-bezier(.215,.61,.355,1)</code> (easeOutCubic). Nothing blurs per frame; the blurred cover wall is one static layer that only translates. Animations run only while visible and stop in battery saver.</p>`;
  const rules=`<ul class="rules"><li><b>Touch targets:</b> 48 px or more on C (every button, tab, chip and each artist name), 40 px on X, 56 dp on T.</li>
   <li><b>Focus:</b> a ${'3 px'} ring (4 dp on T) in <code>--focus</code>, 3 px off the control so the gap shows the page behind it, plus a soft halo; every control gets it with Tab, and frames show it drawn (<code>.is-focus</code>).</li>
   <li><b>Right to left:</b> logical properties only (<code>margin-inline-start</code>, <code>inset-inline-end</code>); back chevrons mirror; the transport (previous, play, next) keeps its left-to-right order and so do times and progress, as media controls do.</li>
   <li><b>200 % text:</b> nothing has a fixed height except the bars; rows grow, names wrap, the cover on Now playing shrinks first.</li>
   <li><b>Never colour alone:</b> every state has an icon <i>and</i> a sentence (amber strip + house with a broken line + words; red strip + swap arrows + words).</li></ul>`;
  return `<div class="page"><h1 class="t-display">Tokens</h1><p class="muted" style="max-width:760px">Every value below is read from the live CSS custom properties of this file, and every ratio is computed here from those values, so this page cannot drift from the frames. Names follow <code>tokens.dart</code>; additions are marked NEW.</p>
   <h2>Colour</h2>${colourTable}<h2>Contrast pairs</h2>${contrast}
   <h2>Radii</h2>${radiiHtml}<h2>Spacing</h2>${spHtml}<h2>Type</h2>${type}<h2>Motion</h2>${motion}<h2>Rules that go with the tokens</h2>${rules}</div>`;
}

function whyPage(){
  return `<div class="page why"><h1 class="t-display">Why: Warm home</h1>
   <p><b>The idea</b><span>The server is a place: its name and colour are on every screen, and first run suits someone who has never run one.</span></p>
   <p><b>Good at</b><span>Honest states: "nothing found", "waiting", "another server answers" and "cannot play" each look and read differently.</span></p>
   <p><b>Also good at</b><span>Big rounded targets (48 px, 56 dp on a TV) and plain words survive 200 % text, right-to-left and a remote.</span></p>
   <p><b>Bad at</b><span>Music-first drama: covers are calmer than in A, artwork colour is only a tint, and the soft serif feels homely, not "pro audio".</span></p>
   <p><b>Flutter, cheap</b><span>New values in <code>EncoreColors</code> and <code>Radii</code>; restyled <code>NavigationBar</code>, <code>NavigationRail</code>, <code>Card</code>, <code>Chip</code>; one bundled font; no shaders.</span></p>
   <p><b>Flutter, new widgets</b><span><code>ServerBadge</code>, <code>ServerCard</code>, <code>ConnectionStrip</code>, <code>MiniPlayer</code>, eight <code>flutter_svg</code> illustrations, <code>FocusTraversalGroup</code> for the TV.</span></p>
   <p><b>Flutter, medium</b><span>A per-server accent (<code>ensureContrast</code> exists) and a light-theme accent that differs from the dark one.</span></p>
   <p><b>Others do better</b><span>A makes the music the show (artwork-coloured headers and player); B reads better from the sofa and at 200 % with less decoration.</span></p></div>`;
}

/* ==================================================================
   ROUTER and viewer bar
   ================================================================== */
const REG={home:HOME,now:NOW,search:SEARCH,welcome:WELCOME,server:YOURSERVER};
const ORDER=['home','now','search','welcome','server'];
function opt(v,l,sel){return `<option value="${v}"${sel?' selected':''}>${esc(l)}</option>`;}
function segHtml(key,opts){return `<div class="seg" data-k="${key}" role="group">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${Q[key]===v}">${l}</button>`).join('')}</div>`;}
function buildBar(){
  const vb=document.getElementById('vb');
  vb.innerHTML=`<div class="brand"><i><b style="height:7px"></b><b style="height:14px"></b><b style="height:10px"></b><b style="height:16px"></b></i><span>Encore · C · Warm home</span></div>
   <div class="pages only-p" role="group" aria-label="Page">${[['screens','Screens'],['tokens','Tokens'],['why','Why']].map(([v,l])=>`<button type="button" data-p="${v}" aria-pressed="${Q.p===v}">${l}</button>`).join('')}</div>
   <span class="grp only-screens"><label for="selS">Screen</label><select id="selS">${ORDER.map(k=>opt(k,REG[k].id+' '+REG[k].title,Q.s===k)).join('')}</select></span>
   <span class="grp only-screens"><label for="selSt">State</label><select id="selSt"></select></span>
   <span class="grp only-screens"><span class="lab">Class</span>${segHtml('c',[['C','C'],['X','X'],['T','T']])}</span>
   <span class="grp"><span class="lab">Theme</span>${segHtml('th',[['dark','Dark'],['light','Light']])}</span>
   <span class="grp"><span class="lab">Text</span>${segHtml('tx',[['1','100 %'],['2','200 %']])}</span>
   <span class="grp"><span class="lab">Writing</span>${segHtml('d',[['ltr','LTR'],['rtl','RTL']])}</span>
   <span class="grp only-screens"><span class="lab">Notes</span>${segHtml('n',[['0','Off'],['1','On']])}</span>`;
  vb.addEventListener('change',e=>{
    if(e.target.id==='selS'){Q.s=e.target.value;Q.st=REG[Q.s].states[0][0];render();}
    if(e.target.id==='selSt'){Q.st=e.target.value;render();}
  });
  vb.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.p){Q.p=b.dataset.p;render();return;}
    const seg=b.closest('.seg'); if(seg){Q[seg.dataset.k]=b.dataset.v;render();}
  });
}
function syncBar(){
  const vb=document.getElementById('vb'); if(!vb.firstChild) return;
  vb.dataset.p=Q.p;
  vb.querySelectorAll('[data-p]').forEach(b=>{if(b.closest('.pages'))b.setAttribute('aria-pressed',String(b.dataset.p===Q.p));});
  vb.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Q[s.dataset.k]===b.dataset.v))));
  const sc=REG[Q.s]; const selS=document.getElementById('selS'); selS.value=Q.s;
  const st=document.getElementById('selSt');
  st.innerHTML=sc.states.map(([v,l])=>opt(v,l,Q.st===v)).join('')+opt('all','All states of this screen',Q.st==='all');
  st.value=Q.st;
  document.querySelectorAll('.only-screens').forEach(e=>e.style.display=Q.p==='screens'?'':'none');
}
function renderScreens(){
  const sc=REG[Q.s]; const keys=sc.states.map(s=>s[0]);
  if(Q.st!=='all' && !keys.includes(Q.st)) Q.st=keys[0];
  const list=Q.st==='all'?keys:[Q.st];
  const fr=list.map(st=>{
    const label=sc.states.find(x=>x[0]===st)[1];
    const fn=sc.draw[Q.c];
    if(!fn) return `<div class="fitem"><div class="fnote"><b>${sc.title} at ${Q.c}:</b> ${sc.missing&&sc.missing[Q.c]||'not drawn'}</div></div>`;
    const r=fn(st);
    return frameBox(Q.c,r.h,{title:`${sc.id} ${sc.title} · ${label}`,note:r.note,legend:r.legend});
  }).join('');
  return `<div class="fgroup">${fr}</div>`;
}
/* self-check: every frame of every screen, state and class is built and its tags are balanced (open #p=check) */
function balance(html){
  const VOID=new Set(['br','img','input','hr','meta','link','wbr']);
  const st=[]; const re=/<(\/?)([a-zA-Z][a-zA-Z0-9]*)(\s[^>]*?)?(\/?)>/g; let m;
  while((m=re.exec(html))){
    const close=m[1],t=m[2].toLowerCase(),self=m[4];
    if(self||VOID.has(t)) continue;
    if(close){ if(!st.length||st[st.length-1]!==t) return 'unexpected </'+t+'> (open: '+st.slice(-3).join('>')+')'; st.pop(); }
    else st.push(t);
  }
  return st.length?'unclosed <'+st.join('>')+'>':'';
}
function selfCheck(){
  let n=0; const bad=[];
  for(const k of ORDER){ const sc=REG[k];
    for(const c of ['C','X','T']){ const fn=sc.draw[c]; if(!fn) continue;
      for(const [st] of sc.states){
        try{ const r=fn(st); n++; const b=balance(r.h); if(b) bad.push(k+'/'+st+'/'+c+': '+b); if(/undefined|NaN|\[object/.test(r.h)) bad.push(k+'/'+st+'/'+c+': undefined text'); }
        catch(e){ bad.push(k+'/'+st+'/'+c+': '+e.message); }
      } } }
  return '<pre id="balance" style="color:var(--on-bg);padding:20px">CHECK '+(bad.length?'FAILED':'OK')+': '+n+' frames built\n'+bad.join('\n')+'</pre>';
}
function render(){
  const de=document.documentElement;
  de.dataset.theme=Q.th; de.dataset.ts=Q.tx; de.dataset.notes=Q.n;
  document.body.classList.toggle('nobar',Q.bar==='0');
  const stage=document.getElementById('stage'); stage.setAttribute('dir',Q.d);
  syncBar();
  stage.innerHTML=Q.p==='check'?selfCheck():Q.p==='tokens'?tokensPage():Q.p==='why'?whyPage():renderScreens();
  stage.classList.toggle('pagemode',Q.p!=='screens');
  fit(); writeURL();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href="#"]'); if(a) e.preventDefault();
  const g=e.target.closest('[data-go]');
  if(g){const [s,st]=g.dataset.go.split('/'); if(REG[s]){Q.s=s;Q.st=st;Q.p='screens';render();window.scrollTo(0,0);}}
});
window.addEventListener('hashchange',()=>{readURL();render();});
function boot(){readURL();buildBar();render();}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fit);
boot();
})();
</script>
